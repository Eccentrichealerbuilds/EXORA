[package]
name = "exora"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "exora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-opener = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10.3"
tauri-plugin-exora = { path = "../tauri-plugin-exora" }
alloy = { version = "2.5.0", features = ["full"] }
alloy-dyn-abi = { version = "1.7", features = ["eip712"] }
perpl-sdk = { git = "https://github.com/PerplFoundation/dex-sdk", rev = "01b9910761755b0a0d9c710c1ede62ab937daa7d", default-features = false }
webpki-root-certs = "1.0.9"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.53.1", features = ["full", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls-vendored"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
