# Certificate bootstrap only. Keep API unavailable until authenticated subscriptions are deployed.
server {
    listen 80;
    listen [::]:80;
    server_name exora-alerts.eccentrichealer.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/exora-alerts-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":"setup_pending"}';
    }
}
