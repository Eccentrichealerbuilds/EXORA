# The Rust API only listens on loopback. Device endpoints require verification or a device token.
limit_req_zone $binary_remote_addr zone=exora_alert_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=exora_alert_enroll:1m rate=3r/m;
server {
    listen 80;
    listen [::]:80;
    server_name exora-alerts.eccentrichealer.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/exora-alerts-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://exora-alerts.eccentrichealer.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name exora-alerts.eccentrichealer.xyz;
    ssl_certificate /etc/letsencrypt/live/exora-alerts.eccentrichealer.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exora-alerts.eccentrichealer.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EXORAalerts:1m;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 32k;
    access_log /var/log/nginx/exora-alerts.access.log;
    error_log /var/log/nginx/exora-alerts.error.log;
    add_header Cache-Control "no-store" always;
    limit_req_status 429;
    location = /v1/enroll {
        limit_req zone=exora_alert_enroll burst=3 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
    location / {
        limit_req zone=exora_alert_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
}
