[package]
name = "exora-alert-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
gcp_auth = "0.12.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
axum = "0.8.9"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

base64 = "0.22"
ed25519-dalek = "2.2"
alloy = { version = "2.5.0", features = ["full"] }
perpl-sdk = { git = "https://github.com/PerplFoundation/dex-sdk", rev = "01b9910761755b0a0d9c710c1ede62ab937daa7d", default-features = false }
